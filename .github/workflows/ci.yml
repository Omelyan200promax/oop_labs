name: C++ CI/CD

on:
  push:
    branches: [ main, "feature/**" ]
    tags: [ "v*" ] # запускается при создании тега (для Releases)
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  
  # ДЖОБ 1: Тесты, покрытие и линтер (Linux)
 
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gcovr cppcheck

      #  Лабораторная 1 
      - name: Настроить CMake lab1 (с покрытием)
        run: cmake -S lab1 -B lab1/build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

      - name: Собрать проект lab1
        run: cmake --build lab1/build

      - name: Запустить тесты lab1
        run: ctest --test-dir lab1/build --output-on-failure

      #  Лабораторная 2 
      - name: Настроить CMake lab2 (с покрытием)
        run: cmake -S lab2 -B lab2/build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

      - name: Собрать проект lab2
        run: cmake --build lab2/build

      - name: Запустить тесты lab2
        run: ctest --test-dir lab2/build --output-on-failure

      # --- Проверки для Лабораторной 2 (можно сделать и для lab1) ---
      - name: Проверить покрытие lab2 (>90%)
        run: |
          cd lab2
          gcovr -r . --filter "src/" --txt-summary --fail-under-line 90 build/

      - name: Статический анализ lab2 (cppcheck)
        run: |
          cppcheck --enable=warning,performance --error-exitcode=1 -I lab2/include lab2/src lab2/app
        

  # ДЖОБ 2: Сборка артефакта и Releases (Windows)
 
  build-release:
    if: startsWith(github.ref, 'refs/tags/v') # только при пуше тега v*
    runs-on: windows-latest
    needs: test-and-lint # запускать только если тесты и линтер прошли
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить MSYS2 (MinGW)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-make

      - name: Настроить и собрать Release (статически) lab2
        shell: msys2 {0}
        run: |
          cmake -S lab2 -B lab2/build-release -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build lab2/build-release

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          files: lab2/build-release/lab2_cli.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}